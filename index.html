<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>拼豆排单</title>
  <meta name="theme-color" content="#c03384" />
  <link rel="stylesheet" href="./src/style.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <div>
          <p class="eyebrow">手机接单小本子</p>
          <h1>拼豆排单</h1>
        </div>
        <span class="today" id="todayText"></span>
      </div>

      <section class="stats" aria-label="订单统计">
        <div class="stat">
          <b id="statUnshipped">0</b>
          <span>未发顾客单</span>
        </div>
        <div class="stat">
          <b id="statTodoItems">0</b>
          <span>待做订单项</span>
        </div>
        <div class="stat">
          <b id="statFinalDue">¥0</b>
          <span>待收尾款</span>
        </div>
      </section>
    </header>

    <section class="toolbar">
      <label class="search">
        <span>搜索</span>
        <input id="searchInput" type="search" placeholder="顾客、内容、图片备注" autocomplete="off" />
      </label>
      <div class="filters" role="tablist" aria-label="订单筛选">
        <button class="filter active" type="button" data-filter="unshipped">未发</button>
        <button class="filter" type="button" data-filter="shipped">已发</button>
        <button class="filter" type="button" data-filter="all">全部</button>
      </div>
    </section>

    <section class="list" id="orderList" aria-label="订单列表"></section>
    <section class="empty" id="emptyState" hidden>
      <b>还没有订单</b>
      <span>微信里确认下单后，点下面的“新增顾客单”马上记下来。</span>
    </section>
  </main>

  <nav class="dock" aria-label="快捷操作">
    <div class="dock-inner">
      <button class="primary" id="addOrderBtn" type="button">新增顾客单</button>
      <button class="dock-btn" id="backupBtn" type="button">备份</button>
      <button class="dock-btn" id="toolsBtn" type="button">工具</button>
    </div>
  </nav>

  <dialog id="orderDialog" class="sheet-dialog">
    <form class="sheet" id="orderForm">
      <div class="sheet-head">
        <h2 id="dialogTitle">新增顾客单</h2>
        <button class="close" id="closeDialog" type="button" aria-label="关闭">×</button>
      </div>

      <input type="hidden" id="editingId" />

      <section class="form-grid">
        <label class="field full">
          <span>顾客微信名 *</span>
          <input id="customerName" required placeholder="微信备注名" />
        </label>
        <label class="field">
          <span>收货人</span>
          <input id="recipient" placeholder="可选" />
        </label>
        <label class="field">
          <span>地址备注</span>
          <input id="addressNote" placeholder="例如：上海浦东" />
        </label>
        <label class="field">
          <span>下单日期 *</span>
          <input id="orderDate" type="date" required />
        </label>
        <label class="field">
          <span>最晚发货 *</span>
          <input id="deadlineDate" type="date" required />
        </label>
        <label class="field">
          <span>定金</span>
          <input id="deposit" type="number" min="0" step="0.01" inputmode="decimal" value="0" />
        </label>
        <label class="field">
          <span>尾款</span>
          <input id="finalPayment" type="number" min="0" step="0.01" inputmode="decimal" value="0" />
        </label>
        <label class="field">
          <span>运费</span>
          <input id="shippingFee" type="number" min="0" step="0.01" inputmode="decimal" value="0" />
        </label>
        <label class="field">
          <span>付款状态</span>
          <select id="paymentStatus">
            <option value="unpaid">未付</option>
            <option value="deposit">已付定金</option>
            <option value="full">已付全款</option>
          </select>
        </label>
        <label class="field">
          <span>发货状态</span>
          <select id="shippingStatus">
            <option value="unshipped">未发</option>
            <option value="shipped">已发</option>
          </select>
        </label>
        <label class="field full">
          <span>备注</span>
          <textarea id="orderNote" placeholder="发货前提醒、包装要求、特殊说明"></textarea>
        </label>
      </section>

      <section class="form-section">
        <div class="section-title">
          <b>订单项</b>
          <button class="small-btn" id="addItemBtn" type="button">加一项</button>
        </div>
        <div id="itemsEditor" class="items-editor"></div>
      </section>

      <div class="submit-row">
        <button class="secondary" id="cancelForm" type="button">取消</button>
        <button class="save" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="toolsDialog" class="sheet-dialog compact">
    <div class="sheet">
      <div class="sheet-head">
        <h2>备份与工具</h2>
        <button class="close" id="closeTools" type="button" aria-label="关闭">×</button>
      </div>

      <div class="tool-list">
        <button class="tool-action" id="exportZipBtn" type="button">
          <b>导出完整 ZIP 备份</b>
          <span>包含订单数据和压缩图片，可用于恢复。</span>
        </button>
        <label class="tool-action file-action">
          <b>导入 ZIP 备份</b>
          <span>恢复订单和图片。导入前会询问覆盖或合并。</span>
          <input id="zipInput" type="file" accept=".zip,application/zip" />
        </label>
        <button class="tool-action" id="exportExcelBtn" type="button">
          <b>导出 Excel 查看表</b>
          <span>只用于查看和统计，不作为完整恢复备份。</span>
        </button>
      </div>

      <p class="backup-note" id="backupNote"></p>
    </div>
  </dialog>

  <dialog id="imageDialog" class="image-dialog">
    <button class="close image-close" id="closeImage" type="button" aria-label="关闭">×</button>
    <img id="largeImage" alt="订单图片预览" />
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./src/db.js"></script>
  <script src="./src/image.js"></script>
  <script src="./src/backup.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
